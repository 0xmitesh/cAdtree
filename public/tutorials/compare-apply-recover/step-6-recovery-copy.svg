<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Recover a separate copy</title><desc id="desc">Restore project copy reads saved Rev 003 and creates a new verified folder below the project's recoveries directory. Main Rev 007 and Lightweight bracket working files remain unchanged. No active branch switch or revision is created.</desc>
<rect width="1200" height="510" fill="#f6f7f3"/>
<g font-family="Arial, sans-serif" fill="#253c35">
<text x="48" y="56" font-size="30" font-weight="700">Return to a saved state without replacing current work</text>
<rect x="652" y="96" width="500" height="87" rx="12" fill="#fff" stroke="#c6d2ca"/>
<text x="902" y="132" font-size="25" text-anchor="middle" font-weight="700">Saved Rev 003</text><text x="902" y="163" font-size="20" text-anchor="middle">Reviewed baseline</text>
<path d="M902 183V249M892 238L902 249L912 238" fill="none" stroke="#087f80" stroke-width="4"/>
<text x="48" y="160" font-size="22" fill="#64786e">CURRENT WORK STAYS IN PLACE</text>
<rect x="48" y="249" width="500" height="178" rx="12" fill="#edf5f0" stroke="#087f80" stroke-width="2"/>
<rect x="652" y="249" width="500" height="178" rx="12" fill="#fff" stroke="#087f80" stroke-width="2"/>
<text x="76" y="292" font-size="25" font-weight="700">Main · latest save Rev 007</text><text x="680" y="292" font-size="25" font-weight="700">New verified recovery copy</text>
<text x="76" y="336" font-size="23">Lightweight bracket · case files</text><text x="680" y="336" font-size="22">A fresh folder under recoveries/</text>
<text x="76" y="387" font-size="22">Both working locations unchanged</text><text x="680" y="387" font-size="22">Contains the saved Rev 003 state</text>
<text x="600" y="476" font-size="22" text-anchor="middle">Recovery creates a separate copy. It does not switch branches or save a revision.</text>
</g></svg>
