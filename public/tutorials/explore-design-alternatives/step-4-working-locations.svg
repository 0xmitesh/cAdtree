<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Separate working locations</title><desc id="desc">Inside Bracket Assembly, working contains main and a unique generated case folder. The revision vault is separate. Folder labels are conceptual; Settings shows the exact generated paths.</desc>
<rect width="1200" height="490" fill="#f6f7f3"/>
<g font-family="Arial, sans-serif" fill="#253c35">
<text x="48" y="58" font-size="30" font-weight="700">Bracket Assembly</text>
<rect x="32" y="86" width="1136" height="284" rx="12" fill="#fff" stroke="#c6d2ca"/>
<text x="64" y="132" font-size="25" font-weight="700">working/</text>
<path d="M110 151V189H345M110 189H855" fill="none" stroke="#c6d2ca" stroke-width="3"/>
<rect x="64" y="189" width="500" height="149" rx="10" fill="#edf5f0" stroke="#087f80" stroke-width="2"/>
<rect x="604" y="189" width="532" height="149" rx="10" fill="#f2f0fa" stroke="#7060b8" stroke-width="2"/>
<text x="90" y="233" font-size="26" font-weight="700">Main</text><text x="630" y="233" font-size="26" font-weight="700">Lightweight bracket</text>
<text x="90" y="276" font-size="24">main/</text><text x="630" y="276" font-size="24">Unique case folder</text>
<text x="90" y="312" font-size="21">Primary working files</text><text x="630" y="312" font-size="21">Independent working files from Rev 003</text>
<text x="48" y="410" font-size="22">cAdtree chooses the case folder name. Settings shows its exact location.</text>
<text x="48" y="451" font-size="21">Saved revisions share the project's separate vault. Keep managed folders in place.</text>
</g></svg>
