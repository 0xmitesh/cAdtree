<title id="title">Independent histories, project-wide numbers</title><desc id="desc">Main Rev 001 leads to Rev 002 then Rev 003. From Rev 003, Lightweight bracket saves Rev 004 then Rev 005. Main's next save is Rev 006, whose parent is Rev 003. Alternatives remain connected to their origin.</desc>
