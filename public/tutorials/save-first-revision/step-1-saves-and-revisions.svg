<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">CAD Save is different from a cAdtree revision</title>
  <desc id="desc">Save normally and often in CAD. Record meaningful engineering milestones as cAdtree revisions.</desc>
  <rect width="1080" height="380" rx="12" fill="#fafcf9"/>
  <g font-family="Segoe UI, sans-serif" fill="#253338">
    <text x="44" y="48" font-size="24" font-weight="600">Normal CAD saves</text>
    <text x="44" y="80" font-size="18" fill="#68777b">Keep saving as you work.</text>
    <g stroke="#b3cac0" stroke-width="2"><path d="M220 132H850"/></g>
    <g fill="#fff" stroke="#b3cac0" stroke-width="2">
      <rect x="72" y="106" width="148" height="52" rx="8"/><rect x="292" y="106" width="148" height="52" rx="8"/>
      <rect x="512" y="106" width="148" height="52" rx="8"/><rect x="732" y="106" width="148" height="52" rx="8"/>
    </g>
    <g font-size="21" text-anchor="middle"><text x="146" y="140">Save</text><text x="366" y="140">Save</text><text x="586" y="140">Save</text><text x="806" y="140">Save</text></g>
    <path d="M44 192H1036" stroke="#dfe5e2"/>
    <text x="44" y="234" font-size="24" font-weight="600">cAdtree revisions</text>
    <text x="44" y="266" font-size="18" fill="#68777b">Record meaningful engineering milestones.</text>
    <path d="M228 318H850" stroke="#087f80" stroke-width="3"/>
    <g fill="#e6f3ec" stroke="#087f80" stroke-width="2"><rect x="72" y="290" width="190" height="56" rx="8"/><rect x="730" y="290" width="190" height="56" rx="8"/></g>
    <g font-size="22" font-weight="600" fill="#087f80" text-anchor="middle"><text x="167" y="326">Rev 001</text><text x="825" y="326">Rev 002</text></g>
  </g>
</svg>
