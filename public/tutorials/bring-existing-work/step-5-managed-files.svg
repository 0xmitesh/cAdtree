<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Edit the managed Main copy</title><desc id="desc">The original CAD folder remains unchanged. Import creates a managed project containing working/main and a separate vault. No saved revision exists yet. Display names simplify generated folder suffixes.</desc>
<rect width="1200" height="500" fill="#f6f7f3"/>
<g font-family="Arial, sans-serif" fill="#253c35">
<rect x="30" y="35" width="425" height="352" rx="12" fill="#fff" stroke="#c6d2ca"/>
<rect x="655" y="35" width="515" height="352" rx="12" fill="#fff" stroke="#8fa99a"/>
<text x="60" y="80" font-size="19" letter-spacing="1">ORIGINAL CAD FOLDER</text><text x="685" y="80" font-size="19" letter-spacing="1">MANAGED PROJECT</text>
<text x="60" y="130" font-size="28" font-weight="700">Bracket Assembly</text>
<text x="60" y="182" font-size="22">Bracket.SLDPRT</text><text x="60" y="219" font-size="22">Mount.SLDPRT</text><text x="60" y="256" font-size="22">BracketAssembly.SLDASM</text><text x="60" y="332" font-size="23" font-weight="700">Unchanged; no synchronization</text>
<text x="685" y="126" font-size="23">Cadtree Home / Client A</text><text x="710" y="168" font-size="26" font-weight="700">Bracket Assembly</text>
<path d="M699 186V322M699 225H721M699 311H721" fill="none" stroke="#9aada0" stroke-width="2"/>
<rect x="729" y="192" width="410" height="75" rx="6" fill="#e8f0e8"/><text x="746" y="222" font-size="25" font-weight="700">working/main</text><text x="746" y="251" font-size="21">Your CAD files: work here now</text>
<text x="737" y="316" font-size="24" font-weight="700">vault</text><text x="737" y="350" font-size="21">Saved history: no revisions yet</text>
